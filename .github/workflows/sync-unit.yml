name: Sinkron status unit

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-unit
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tarik status dari tracker
        env:
          PUBLIK_UNIT_TOKEN: ${{ secrets.PUBLIK_UNIT_TOKEN }}
        run: npm run unit:tarik
      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet -- src/data/unit-status.json src/data/pricelist.json; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/unit-status.json src/data/pricelist.json
          git commit -m "chore: sinkronkan status unit"
          git push
